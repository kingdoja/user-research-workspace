name: Project Verification

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_SSL_MODE: disable
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 uses node:sqlite and requires Node.js >= 22.13.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm smoke:isolated universal-agent-product-tools
        env:
          LOCAL_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: pnpm smoke:isolated source-connector
        env:
          LOCAL_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: pnpm smoke:isolated realtime-interview
        if: ${{ env.OPENAI_API_KEY != '' || env.DEEPSEEK_API_KEY != '' }}
        env:
          LOCAL_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: pnpm exec next build --webpack
